name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SkillGate version
